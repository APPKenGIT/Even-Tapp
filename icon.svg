<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d7a58"/>
      <stop offset="45%" stop-color="#085f43"/>
      <stop offset="100%" stop-color="#044e39"/>
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="radialGlow" cx="35%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#044e39" stop-opacity="0"/>
    </radialGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Soft Card Shadow -->
    <filter id="cardShadow" x="-15%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#022316" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#022316" flood-opacity="0.35"/>
    </filter>

    <!-- Checkmark Shadow -->
    <filter id="checkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#047857" flood-opacity="0.25"/>
    </filter>

    <!-- Card Clip Path -->
    <clipPath id="cardClip">
      <rect x="113" y="86" width="286" height="295" rx="49" ry="49"/>
    </clipPath>
  </defs>

  <!-- 1. Base Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="115" fill="url(#radialGlow)"/>

  <!-- Subtle ambient rings -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="235" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5"/>

  <!-- 2. Central Floating Calendar Card with Shadow -->
  <g filter="url(#cardShadow)">
    <!-- White Card Base -->
    <rect x="113" y="86" width="286" height="295" rx="49" ry="49" fill="#ffffff"/>

    <!-- Calendar Header (clipped to top curve) -->
    <g clip-path="url(#cardClip)">
      <rect x="113" y="86" width="286" height="83" fill="url(#headerGrad)"/>
      <line x1="133" y1="88" x2="379" y2="88" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
    </g>

    <!-- 2 Modern Circular Grommets -->
    <!-- Left Grommet -->
    <g transform="translate(180, 127)">
      <circle cx="0" cy="0" r="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="0" cy="0" r="6.5" fill="#034b36"/>
      <circle cx="0" cy="-3.5" r="1.5" fill="#ffffff" fill-opacity="0.75"/>
    </g>
    <!-- Right Grommet -->
    <g transform="translate(332, 127)">
      <circle cx="0" cy="0" r="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="0" cy="0" r="6.5" fill="#034b36"/>
      <circle cx="0" cy="-3.5" r="1.5" fill="#ffffff" fill-opacity="0.75"/>
    </g>

    <!-- 3. Checkmark & Tap Wave -->
    <g filter="url(#checkShadow)">
      <path d="M 178 245 L 225 295 L 315 200" 
            fill="none" 
            stroke="url(#checkGrad)" 
            stroke-width="27" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>

    <!-- Tap Waves & Beacon at (315, 200) -->
    <!-- Outer wave -->
    <circle cx="315" cy="200" r="46" fill="none" stroke="#34d399" stroke-opacity="0.5" stroke-width="3"/>
    <!-- Inner wave -->
    <circle cx="315" cy="200" r="28" fill="none" stroke="#10b981" stroke-opacity="0.8" stroke-width="4"/>
    <!-- Glowing Beacon Button -->
    <circle cx="315" cy="200" r="13" fill="#34d399" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="315" cy="200" r="5" fill="#ffffff"/>

    <!-- 4. Three Status Dots -->
    <circle cx="236" cy="353" r="4.5" fill="#10b981"/>
    <circle cx="256" cy="353" r="4.5" fill="#34d399"/>
    <circle cx="276" cy="353" r="4.5" fill="#cbd5e1"/>
  </g>
</svg>

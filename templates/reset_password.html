{% extends "base.html" %}

{% block title %}Nieuw Wachtwoord Instellen | Dodentocht Teamtraining{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="auth-icon-circle bg-forest text-white mx-auto mb-3">
                            <i class="bi bi-shield-lock-fill fs-2"></i>
                        </div>
                        <h3 class="fw-bold">Nieuw Wachtwoord</h3>
                        <p class="text-muted small">Kies een nieuw veilig wachtwoord voor <strong>{{ email }}</strong></p>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold">Nieuw Wachtwoord <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Minimaal 6 tekens" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password_confirm" class="form-label fw-bold">Bevestig Nieuw Wachtwoord <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-check2-circle"></i></span>
                                <input type="password" class="form-control" id="password_confirm" name="password_confirm" placeholder="Herhaal nieuw wachtwoord" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-forest w-100 py-2 fw-bold shadow-sm mb-3">
                            <i class="bi bi-check-lg me-1"></i> Wachtwoord Opslaan & Inloggen
                        </button>
                    </form>

                    <div class="mt-4 pt-3 border-top text-center">
                        <small class="text-muted">
                            <i class="bi bi-shield-check text-success me-1"></i>
                            Wachtwoorden worden veilig gehasht conform GDPR. Niemand kan dit wachtwoord inzien.
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

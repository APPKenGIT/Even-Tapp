{% extends "base.html" %}

{% block title %}Nieuwe Bevestigingslink Aanvragen | Dodentocht{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="auth-icon-circle bg-forest text-white mx-auto mb-3">
                            <i class="bi bi-envelope-check fs-2"></i>
                        </div>
                        <h3 class="fw-bold">Bevestigingsmail Opnieuw Sturen</h3>
                        <p class="text-muted small">Vul je e-mailadres in om een nieuwe activatielink te ontvangen.</p>
                    </div>

                    <form method="POST" action="{{ url_for('resend_confirmation') }}">
                        <div class="mb-4">
                            <label for="email" class="form-label fw-bold">E-mailadres</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="naam@voorbeeld.be" required autofocus>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-forest w-100 py-2 fw-bold shadow-sm mb-3">
                            <i class="bi bi-send me-1"></i> Verstuur Nieuwe Link
                        </button>

                        <div class="text-center">
                            <a href="{{ url_for('login') }}" class="fw-semibold text-muted text-decoration-none small">
                                <i class="bi bi-arrow-left me-1"></i> Terug naar inloggen
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
